t:600 25px Georgia,"Songti SC",serif;margin:0}.section-bar .hint{font-size:12px;color:var(--muted)}.section-bar .grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.station{background:var(--card);border:1px solid var(--line);padding:23px 22px;box-shadow:var(--shadow)}.station-head{display:flex;justify-content:space-between;gap:14px}.station h3{font-size:16px;font-weight:600;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:6px}.availability{font:600 14px Georgia,serif;color:var(--sage);white-space:nowrap}.ratio{height:5px;background:#ece9e1;display:flex;margin:21px 0 18px}.ratio i{height:100%}.ratio .free{background:var(--sage)}.ratio .used{background:var(--amber)}.ratio .fault{background:var(--clay)}.devices{display:grid;gap:8px}.device{border-top:1px solid var(--line);padding-top:12px}.device-head{display:flex;align-items:center;font-size:12px}.device-head b{font-weight:600}.device-state{margin-left:auto;color:var(--muted);font-size:11px}.device-state.error{color:var(--clay)}.counts{display:flex;gap:12px;color:var(--muted);font-size:11px;margin-top:8px}.counts .free{color:var(--sage)}.counts .used{color:var(--amber)}.counts .fault{color:var(--clay)}.ports{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.port{width:23px;height:23px;display:grid;place-items:center;font-size:10px;color:white;border-radius:50%;background:#9d9a91}.port.free{background:var(--sage)}.port.used{background:var(--amber)}.port.fault{background:var(--clay)}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.notice{display:none;background:#f5dfd8;border:1px solid #eac1b4;padding:12px 15px;margin-bottom:22px;font-size:12px;color:#88422f}.notice.show{display:block}footer{color:var(--muted);font-size:11px;margin-top:50px}@media(max-width:760px){main{padding:28px 16px 50px}.top{display:block;margin-bottom:35px}.actions{margin-top:22px;justify-content:space-between}.metrics{grid-template-columns:rep +</style></head><body><main><header class="top"><div><div class="eyebrow">NEPTUNE · YUQUAN CAMPUS</div><h1>今天，哪里还有空位？</h1><p class="lead">实时查看玉泉校区各充电站点、设备与插座状态。每个圆点对应一个真实插座。</p></div><div class="actions"><div class="status" id="status"><i class="dot"></i><span>连接中…</span></div><button id="refresh">刷新</button></div></header><div class="notice" id="notice"></div><section class="metrics" id="metrics"></section><div class="section-bar"><h2>站点</h2><span class="hint" id="hint"></span><span class="grow"></span><select id="filter"><option value="all">全部站点</option><option value="available">有空闲</option><option value="busy">使用中</option><option value="fault">有故障</option></select></div><section class="grid" id="grid"></section><footer>公开设备数据 · 自动刷新间隔 15 秒 · 仅用于个人学习与状态查看</footer></main><script>
+const $=s=>document.querySelector(s),labels={free:'空闲',used:'使用中',fault:'故障',other:'其他'};let snapshot=null;function escape(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStatus(kind,text){$('#status').className='status '+kind;$('#status span').textContent=text}async function load(){const btn=$('#refresh');btn.disabled=true;try{const res=await fetch('/api/status?ts='+Date.now());if(!res.ok)throw Error('HTTP '+res.status);snapshot=await res.json();render();setStatus(snapshot.last_error?'error':'online',snapshot.last_error?'部分设备异常':'更新于 '+snapshot.updated_at);$('#notice').textContent=snapshot.last_error?'部分设备异常：'+snapshot.last_error:'';$('#notice').classList.toggle('show',!!snapshot.last_error)}catch(e){setStatus('error','连接失败');$('#notice').textContent='无法获取数据：'+e.message;$('#notice').classList.add('show')}finally{btn.disabled=false}}function render(){const ss=snapshot?.stations||[],t={free:0,used:0,fault:0,other:0};ss.forEach(s=>Object.keys(t).forEach(k=>t[k]+=s[k]||0));$('#metrics').innerHTML=[['','全部插座',Object.values(t).reduce((a,b)=>a+b,0)],['free','空闲',t.free],['used','使用中',t.used],['fault','故障',t.fault]].map(x=>`<div class="metric ${x[0]}"><div class="number">${x[2]}</div><div class="label">${x[1]}</div></div>`).join('');$('#hint').textContent=ss.length?`${ss.length} 个站点 · ${ss.reduce((n,s)=>n+s.devices,0)} 台设备`:'';draw()}function draw(){const mode=$('#filter').value,ss=(snapshot?.stations||[]).filter(s=>mode==='all'||mode==='available'&&s.free>0||mode==='busy'&&s.used>0||mode==='fault'&&s.fault>0);$('#grid').innerHTML=ss.length?ss.map(station).join(''):'<div class="empty">没有符合条件的站点</div>'}function station(s){const d=s.devices_detail||[],available=s.total?Math.round(s.free/s.total*100):0;return `<article class="station"><div class="station-head"><div><h3>${escape(s.name)}</h3><div class="meta">${s.devices} 台设备 · ${s.total} 个插座</div></div><div class="availability">${available}% 可用</div></div><div class="ratio"><i class="free" style="width:${pct(s.free,s.total)}%"></i><i class="used" style="width:${pct(s.used,s.total)}%"></i><i class="fault" style="width:${pct(s.fault,s.total)}%"></i></div><div class="devices">${d.map(device).join('')}</div></article>`}function pct(n,t){return t?100*n/t:0}function device(d){if(!d.reachable)return `<div class="device"><div class="device-head"><b>设备 ${escape(d.id)}</b><span class="device-state error">获取失败</span></div><div class="meta">${escape(d.error||'请求失败')}</div></div>`;return `<div class="device"><div class="device-head"><b>设备 ${escape(d.id)}</b><span class="device-state">在线 · ${d.total} 孔</span></div><div class="counts"><span class="free">空闲 ${d.free}</span><span class="used">使用中 ${d.used}</span><span class="fault">故障 ${d.fault}</span></div><div class="ports">${d.ports.map((p,i)=>`<span class="port ${p}" title="${labels[p]}">${i+1}</span>`).join('')}</div></div>`}$('#refresh').onclick=load;$('#filter').onchange=draw;load();setInterval(load,15000);
+</script></body></html>
