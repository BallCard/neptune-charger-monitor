<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尼普顿充电桩 · 玉泉校区监控</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --free: #22c55e;
    --used: #f59e0b;
    --fault: #ef4444;
    --other: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    padding: 20px 24px 48px;
  }
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
  }
  header .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-pill .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted);
  }
  .status-pill.online .dot { background: var(--free); box-shadow: 0 0 6px var(--free); }
  .status-pill.error .dot { background: var(--fault); box-shadow: 0 0 6px var(--fault); }
  button {
    background: #334155;
    color: var(--text);
    border: 1px solid #475569;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #3f4c61; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat .num { font-size: 30px; font-weight: 700; line-height: 1; }
  .stat .label { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stat.free .num { color: var(--free); }
  .stat.used .num { color: var(--used); }
  .stat.fault .num { color: var(--fault); }
  .stat.total .num { color: #60a5fa; }

  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.free { background: var(--free); }
  .swatch.used { background: var(--used); }
  .swatch.fault { background: var(--fault); }
  .swatch.other { background: var(--other); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 2px;
    font-weight: 600;
  }
  .card .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .card .counts {
    display: flex;
    gap: 14px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .counts b { font-weight: 700; }
  .counts .c-free { color: var(--free); }
  .counts .c-used { color: var(--used); }
  .counts .c-fault { color: var(--fault); }
  .ports { display: flex; flex-wrap: wrap; gap: 5px; }
  .port {
    width: 15px; height: 15px;
    border-radius: 4px;
    background: var(--other);
  }
  .port.free { background: var(--free); }
  .port.used { background: var(--used); }
  .port.fault { background: var(--fault); }
  .card.offline { opacity: 0.55; }
  .card .offline-tag { color: var(--fault); font-size: 12px; }

  .error-bar {
    display: none;
    background: #7f1d1d;
    border: 1px solid #b91c1c;
    color: #fecaca;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    word-break: break-all;
  }
  .error-bar.show { display: block; }

  footer { margin-top: 24px; color: var(--muted); font-size: 12px; }

  .station-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .availability { color: #2563eb; background: #dbeafe; border-radius: 999px; padding: 5px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .utilization { height: 7px; overflow: hidden; display: flex; border-radius: 999px; background: #334155; margin: 0 0 14px; }
  .utilization i { display: block; height: 100%; } .utilization .free { background: var(--free); } .utilization .used { background: var(--used); } .utilization .fault { background: var(--fault); }
  .device-list { display: grid; gap: 8px; } .device { background: #0f1b30; border: 1px solid #334155; border-radius: 9px; padding: 10px; }
  .device-head { display: flex; align-items: center; font-size: 12px; }.device-state { margin-left: auto; color: var(--muted); font-size: 11px; }.device-state.error { color: var(--fault); }
  .device-counts { display: flex; gap: 10px; margin: 8px 0; font-size: 11px; }.device-counts b { font-size: 12px; }.offline-device { border-color: #7f1d1d; }
  .port { width: 22px; height: 22px; display: grid; place-items: center; color: white; font-size: 10px; font-weight: 700; }

</style>
</head>
<body>
<header>
  <div>
    <h1>🔌 尼普顿充电桩 · 玉泉校区</h1>
    <div class="sub">公开数据 · 无需登录 · 每 20 秒自动刷新</div>
  </div>
  <div class="spacer"></div>
  <div class="status-pill" id="statusPill">
    <span class="dot"></span>
    <span id="statusText">连接中…</span>
  </div>
  <button id="refreshBtn">立即刷新</button>
</header>

<div class="error-bar" id="errorBar"></div>

<div class="summary" id="summary"></div>

<div class="legend">
  <span><i class="swatch free"></i>空闲</span>
  <span><i class="swatch used"></i>使用中</span>
  <span><i class="swatch fault"></i>故障</span>
  <span><i class="swatch other"></i>其他</span>
</div>

<div class="grid" id="grid"></div>

<footer>
  数据源：尼普顿公开设备接口 · 本面板仅用于个人学习与使用状态查看。
</footer>

<script>
const REFRESH_MS = 15000;

function setStatus(mode, text) {
  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill ' + mode;
  document.getElementById('statusText').textContent = text;
}

async function load(force) {
  try {
    const res = await fetch('/api/status?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
    if (!data.updated_at) {
      setStatus('', '正在获取数据…');
    } else if (data.last_error) {
      setStatus('error', '部分设备异常');
    } else {
      setStatus('online', '在线 · ' + data.updated_at);
    }
    const err = document.getElementById('errorBar');
    if (data.last_error) {
      err.textContent = '⚠ ' + data.last_error;
      err.classList.add('show');
    } else {
      err.classList.remove('show');
    }
  } catch (e) {
    setStatus('error', '连接后端失败');
    const err = document.getElementById('errorBar');
    err.textContent = '⚠ 无法连接后端：' + e.message + '（请确认 monitor.py 正在运行）';
    err.classList.add('show');
  }
}

function render(data) {
  const stations = data.stations || [];
  const total = { free: 0, used: 0, fault: 0, other: 0, count: 0 };
  stations.forEach(s => {
    total.free += s.free; total.used += s.used;
    total.fault += s.fault; total.other += s.other; total.count += s.total;
  });

  document.getElementById('summary').innerHTML = [
    ['free', '空闲插座', total.free], ['used', '使用中', total.used],
    ['fault', '故障', total.fault], ['total', '总插座', total.count],
  ].map(([cls, label, num]) =>
    `<div class="stat ${cls}"><div class="num">${num}</div><div class="label">${label}</div></div>`
  ).join('');

  const grid = document.getElementById('grid');
  if (!stations.length) {
    grid.innerHTML = '<div class="card"><div class="meta">正在抓取玉泉校区充电桩数据，请稍候…</div></div>';
    return;
  }
  grid.innerHTML = stations.map(s => {
    const deviceCards = (s.devices_detail || []).map(d => {
      if (!d.reachable) return `<div class="device offline-device"><div><b>设备 ${escapeHtml(d.id)}</b><span class="device-state error">获取失败</span></div><div class="offline-tag">${escapeHtml(d.error || '请求失败')}</div></div>`;
      return `<div class="device"><div class="device-head"><b>设备 ${escapeHtml(d.id)}</b><span class="device-state">在线 · ${d.total} 孔</span></div><div class="device-counts"><span class="c-free">空闲 <b>${d.free}</b></span><span class="c-used">使用 <b>${d.used}</b></span><span class="c-fault">故障 <b>${d.fault}</b></span></div><div class="ports">${d.ports.map((p, i) => `<span class="port ${p}" title="${portLabel(p)} · ${i + 1} 号插座">${i + 1}</span>`).join('')}</div></div>`;
    }).join('');
    const usable = s.total ? Math.round(s.free / s.total * 100) : 0;
    return `<div class="card ${s.reachable ? '' : 'offline'}"><div class="station-head"><div><h2>${escapeHtml(s.name)}</h2><div class="meta">${s.devices} 个设备 · 共 ${s.total} 个插座</div></div><div class="availability">${usable}% 可用</div></div><div class="counts"><span class="c-free">空闲 <b>${s.free}</b></span><span class="c-used">使用 <b>${s.used}</b></span><span class="c-fault">故障 <b>${s.fault}</b></span></div><div class="utilization"><i class="free" style="width:${s.total ? s.free / s.total * 100 : 0}%"></i><i class="used" style="width:${s.total ? s.used / s.total * 100 : 0}%"></i><i class="fault" style="width:${s.total ? s.fault / s.total * 100 : 0}%"></i></div><div class="device-list">${deviceCards}</div></div>`;
  }).join('');
}

function portLabel(status) {
  return { free: '空闲', used: '使用中', fault: '故障', other: '其他' }[status] || '其他';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('refreshBtn').addEventListener('click', () => load(true));
load();
setInterval(() => load(), REFRESH_MS);
</script>
</body>
</html>
